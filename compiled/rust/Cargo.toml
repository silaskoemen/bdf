[package]
name = "bdf_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bdf_rust"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.19"
ndarray = "0.15"
pyo3 = { version = "0.19", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
statrs = "0.18.0"
log = "0.4.27"
