seed: 1234
n_splits: 10
n_trials: 50
sample_size: 5000
logging:
  level: DEBUG
model:
  name: knn_clas
  target_type: classification
  class_name: KNeighborsClassifier
  probabilistic: false
  compatible_target_domains:
  - binary
  fixed_init_kwargs: {}
  tunable_init_kwargs:
    n_neighbors:
      type: int
      low: 1
      high: 50
    weights:
      type: categorical
      categories:
      - uniform
      - distance
    algorithm:
      type: categorical
      categories:
      - auto
      - ball_tree
      - kd_tree
      - brute
    leaf_size:
      type: int
      low: 10
      high: 100
    p:
      type: int
      low: 1
      high: 2
