seed: 1234
n_splits: 10
n_trials: 50
sample_size: 5000
logging:
  level: DEBUG
model:
  name: lgbm_reg
  target_type: regression
  class_name: LGBMRegressor
  probabilistic: false
  compatible_target_domains:
  - real
  - positive_real
  - nonnegative_real
  - integer
  - positive_integer
  - nonnegative_integer
  log_transform_target: false
  standardize_target: both
  fixed_init_kwargs:
    objective: regression
    metric: mse
    boosting_type: gbdt
    verbose: -1
    random_state: 1234
    bagging_seed: 1234
    feature_fraction_seed: 1234
    data_random_seed: 1234
    deterministic: true
  tunable_init_kwargs:
    num_leaves:
      type: int
      low: 5
      high: 250
    learning_rate:
      type: float
      low: 0.001
      high: 0.2
      log: true
    max_depth:
      type: int
      low: 2
      high: 15
    n_estimators:
      type: int
      low: 10
      high: 250
    min_child_samples:
      type: int
      low: 5
      high: 100
    subsample:
      type: float
      low: 0.5
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.5
      high: 1.0
  fit_kwargs:
    early_stopping_rounds: 10
    verbose: -1
