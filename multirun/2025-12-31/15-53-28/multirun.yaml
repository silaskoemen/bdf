hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - model=lgbm_reg,rf_reg,ngboost_reg,catbunc_reg
  job:
    name: run
    chdir: null
    override_dirname: model=lgbm_reg,rf_reg,ngboost_reg,catbunc_reg
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/silaskoemen/Documents/Projects/BayesianDistributionalForest
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/silaskoemen/Documents/Projects/BayesianDistributionalForest/benchmarks/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      model: bdf_normalmunormal
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
seed: 1234
n_splits: 10
n_trials: 50
sample_size: 5000
logging:
  level: DEBUG
model:
  name: bdf_normalmunormal
  target_type: regression
  class_name: BDFRegressor
  probabilistic: true
  compatible_target_domains:
  - real
  - positive_real
  - nonnegative_real
  - integer
  - nonnegative_integer
  - positive_integer
  fixed_init_kwargs:
    dist: NormalMuNormal
    random_state: 1234
    max_depth: 50
  tunable_init_kwargs:
    n_trees:
      type: int
      low: 5
      high: 200
    reg_lambda:
      type: float
      low: 1.0e-05
      high: 100.0
      log: true
    reg_gamma:
      type: float
      low: 0.0
      high: 1.0
    reg_nu:
      type: float
      low: 0.0
      high: 1.0
    min_samples_leaf:
      type: int
      low: 5
      high: 50
    min_samples_split:
      type: int
      low: 10
      high: 100
    subsample:
      type: float
      low: 0.5
      high: 1.0
    colsample:
      type: float
      low: 0.5
      high: 1.0
    eta:
      type: float
      low: 0.001
      high: 0.1
      log: true
  tunable_params:
    sigma_mu:
      type: float
      low: 0.1
      high: 150.0
    score_method:
      type: categorical
      categories:
      - nll
      - nle
  fixed_params:
    mu_mu: auto
    score_correction: bic
