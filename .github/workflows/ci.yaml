name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Removed hardcoded version to use latest stable
          cache: true
          environments: lint
      - name: Run Lint
        run: pixi run -e lint lint

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Removed hardcoded version
          cache: true
          run-install: true
          environments: test

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "compiled/rust"

      - name: Build Rust Extension
        run: pixi run build-rust

      - name: Run Tests
        # Added -v to see individual test execution in logs
        run: pixi run -e test test -- -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Removed hardcoded version
          cache: true
          environments: docs

      - name: Build Docs
        run: pixi run -e docs docs-build

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          # filepath: /Users/silaskoemen/Documents/Projects/BayesianDistributionalForest/.github/workflows/ci.yaml
