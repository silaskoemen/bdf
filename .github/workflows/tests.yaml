name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.12", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./compiled/rust"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        # If you don't have a [dev] extra in setup.py/pyproject.toml
        # pip install -r requirements-dev.txt (or equivalent)
        pip install black isort ruff pyright mypy

    - name: Format check with Black
      run: black --check .

    - name: Import check with isort
      run: isort --check .

    - name: Lint with ruff
      run: ruff check src compiled

    - name: Type check with pyright
      run: pyright src

    - name: Type check with mypy
      run: mypy src

    - name: Check Rust code
      run: |
        cd compiled/rust
        cargo clippy -- -D warnings

    - name: Run Python and Rust tests
      run: python tests/runner.py
