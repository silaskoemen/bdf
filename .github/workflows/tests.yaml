name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.12", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./compiled/rust"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        # If you don't have a [dev] extra in setup.py/pyproject.toml
        # pip install -r requirements-dev.txt (or equivalent)
        pip install black==23.3.0 isort==5.12.0 ruff==0.0.262 pyright==1.1.401 mypy

    - name: Format check with Black
      run: black --check --config pyproject.toml .

    - name: Import check with isort
      run: isort --check --settings-path pyproject.toml .

    - name: Lint with ruff
      run: ruff check --config pyproject.toml src compiled

    - name: Type check with mypy
      run: mypy --config-file pyproject.toml src

    - name: Check Rust code
      run: |
        cd compiled/rust
        cargo clippy -- -D warnings

    - name: Run Python and Rust tests
      run: python tests/runner.py
