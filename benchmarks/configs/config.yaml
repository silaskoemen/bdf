# Main config for regression tests
defaults:
  - _self_
  - model: bdf_kde  # Model config to use

seed: 1234  # Random seed for splitting, cv and tuning
n_splits: 10  # Number of CV splits, fold 0 is always used for tuning
n_trials: 50  # Number of optuna trials per dataset
sample_size: 1000  # Number of samples of predictive distribution to draw for prob. metrics
datasets: null  # Optional list of dataset names to run; null runs all compatible datasets
result_suffix: ""  # Optional suffix for result YAMLs; filtered runs default to "_filtered"

# Tuning configuration
tuning_metric:
  regression: crps      # "mse" or "crps"
  classification: log_loss  # "log_loss" or "brier"
tuning_sample_size: 100  # Number of samples for CRPS during tuning (smaller for speed)

logging:
  level: DEBUG  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
