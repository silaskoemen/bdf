# Main config for regression tests
defaults:
  - _self_
  - model: lightgbm_clas

seed: 1234  # Random seed for splitting, cv and tuning
n_trials: 50  # Number of optuna trials per dataset
n_samples: 10000  # Number of samples of predictive distribution to draw for prob. metrics

logging:
  level: DEBUG  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
