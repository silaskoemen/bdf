# LightGBM regression model config

name: lgbm_clas
target_type: classification
class_name: LGBMClassifier
probabilistic: false

compatible_target_domains: [binary]

fixed_init_kwargs:
  metric: log_loss  # or gini
  boosting_type: gbdt
  verbose: -1
  random_state: 1234
  bagging_seed: 1234
  feature_fraction_seed: 1234
  data_random_seed: 1234
  deterministic: true

tunable_init_kwargs:
  num_leaves:
    type: int
    low: 5
    high: 250
  learning_rate:
    type: float
    low: 0.0001
    high: 0.2
    log: true
  max_depth:
   type: int
   low: 3
   high: 15
  n_estimators:
    type: int
    low: 10
    high: 250

fit_kwargs:
  early_stopping_rounds: 10
  verbose: -1
