# XGBoostLSS Gaussian-mixture distributional boosting baseline

name: xgboostlss_gaussian_mixture
target_type: regression
class_name: XGBoostLSSRegressor
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, integer, nonnegative_integer, positive_integer]

fixed_init_kwargs:
  dist_name: GaussianMixture
  stabilization: None
  response_fn: softplus
  loss_fn: nll
  mixture_tau: 1.0
  mixture_hessian_mode: individual
  random_state: 1234
  verbosity: 0

tunable_init_kwargs:
  mixture_components:
    type: categorical
    categories: [2, 3, 4]
  n_estimators:
    type: int
    low: 50
    high: 500
  eta:
    type: float
    low: 0.0001
    high: 0.3
    log: true
  max_depth:
    type: int
    low: 1
    high: 10
  gamma:
    type: float
    low: 0.00000001
    high: 40.0
    log: true
  subsample:
    type: float
    low: 0.2
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.2
    high: 1.0
  min_child_weight:
    type: float
    low: 0.00000001
    high: 500.0
    log: true
