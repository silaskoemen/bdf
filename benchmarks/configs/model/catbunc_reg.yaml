name: catbunc_reg
target_type: regression
class_name: CatBoostUncertaintyRegressor
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, positive_integer, nonnegative_integer]

fixed_init_kwargs:
  random_state: 1234
  verbose: false
  loss_function: RMSEWithUncertainty
  posterior_sampling: true

tunable_init_kwargs:
  iterations:
    type: int
    low: 50
    high: 1000  # Could leave at default 1000
  learning_rate:
    type: float
    low: 0.001
    high: 0.2
    log: true
  depth:
    type: int
    low: 2
    high: 15
  l2_leaf_reg:
    type: float
    low: 1e-2  # Degenerate solution, too small -> invalid float value: inf
    high: 100.0
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  model_size_reg:
    type: float
    low: 0.5
    high: 2.0
  colsample_bylevel:
    type: float
    low: 0.5
    high: 1.0
