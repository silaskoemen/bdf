# LightGBM regression model config

name: lightgbm_reg
target_type: regression
class_name: LGBMRegressor
probabilistic: false

compatible_target_domains: [R, R+, Z, Z+]  # Supports all regression-style targets
standardize_target: both  # Possibly standardize outcome (standard scaling), supports 'no', 'only', 'both'

fixed_init_kwargs:
  objective: regression
  metric: mse
  boosting_type: gbdt
  verbose: -1

tunable_init_kwargs:
  num_leaves:
    type: int
    low: 5
    high: 250
  learning_rate:
    type: float
    low: 0.0001
    high: 0.2
    log: true
  max_depth:
   type: int
   low: 3
   high: 15
  n_estimators:
    type: int
    low: 10
    high: 500

fit_kwargs:
  early_stopping_rounds: 10
  verbose: -1
