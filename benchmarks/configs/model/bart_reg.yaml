# BART model config

name: bart_reg
target_type: regression
class_name: BARTRegressor
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, integer, nonnegative_integer, positive_integer]

fixed_init_kwargs:
  random_state: 1234

tunable_init_kwargs:
  n_trees:
    type: int
    low: 10
    high: 200
  sigma_a:
    type: int
    low: 0.0001
    high: 1
    log: true
  sigma_b:
    type: int
    low: 0.0001
    high: 1
    log: true
  n_samples:
    type: int
    low: 100
    high: 250
  n_burn:
    type: int
    low: 10
    high: 250
  p_grow:
    type: float
    low: 0.1
    high: 0.9
  alpha:
    type: float
    low: 0.0
    high: 1.0
  beta:
    type: float
    low: 0.5
    high: 5.0
