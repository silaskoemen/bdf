# Random Forest quantile regression model config

name: qrf
target_type: regression
class_name: RandomForestQuantileRegressor
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, integer, nonnegative_integer, positive_integer]

fixed_init_kwargs:
  random_state: 1234
  # Keep all leaf samples for accurate empirical quantile estimation.
  # Subsampling leaf samples (max_samples_leaf finite) degrades tail quantiles.
  max_samples_leaf: null
  bootstrap: true
  # squared_error keeps the objective compatible with all real-valued target domains.
  # poisson would fail on negative targets; absolute_error is slower with no consistent gain.
  criterion: squared_error

tunable_init_kwargs:
  n_estimators:
    type: int
    low: 50
    high: 500
  max_depth:
    type: int
    low: 2
    high: 30
  min_samples_split:
    type: int
    low: 2
    high: 50
  min_samples_leaf:
    type: int
    low: 1
    high: 50
  max_features:
    type: float
    low: 0.1
    high: 1.0
  max_samples:
    type: float
    low: 0.5
    high: 1.0
