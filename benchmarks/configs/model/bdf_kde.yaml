# LightGBM regression model config

name: bdf_kde
target_type: regression
class_name: BDFRegressor
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, integer, nonnegative_integer, positive_integer]

fixed_init_kwargs:
  dist: KDE
  random_state: 1234
  verbose: 0

tunable_init_kwargs:
  n_trees:
    type: int
    low: 15
    high: 100
  alpha:
    type: float
    low: 0.00001
    high: 0.1
    log: true
  gamma:
    type: float
    low: 0.0001
    high: 1.0
    log: true
  delta:
    type: float
    low: 0.0001
    high: 0.1
    log: true
  min_samples_leaf:
    type: int
    low: 10
    high: 100
  # max_depth:
  #   type: int
  #   low: 10
  #   high: 30
  # min_samples_split:
  #   type: int
  #   low: 10
  #   high: 100
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample:
    type: float
    low: 0.5
    high: 1.0
  eta:
    type: float
    low: 0.001
    high: 0.1
    # log: true

tunable_params:
  bandwidth:
    type: categorical
    categories: [scott, silverman]
  # kernel:
  #   type: categorical
  #   categories: [gaussian, epanechnikov]
  score_correction:
    type: categorical
    categories: [loo_cv, bic, null]
  # bandwidth_policy:
  #   type: categorical
  #   categories: [parent, per_split]

fixed_params:
  # score_correction: null  # could use bic too
  kernel: gaussian
  parent_bw_refine_top_k: 3 # number of top splits to refine with child-specific bandwidth for final scores
  score_cv_folds: 3
  kde_backend: switch
  bandwidth_policy: parent
  use_compact_support: false  # Whether to use compact support as speedup
