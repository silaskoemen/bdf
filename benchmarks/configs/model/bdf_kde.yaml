# LightGBM regression model config

name: bdf_kde
target_type: regression
class_name: BDFModel
probabilistic: true

compatible_target_domains: [real, positive_real, nonnegative_real, integer, nonnegative_integer, positive_integer]

fixed_init_kwargs:
  dist: KDE
  random_state: 1234

tunable_init_kwargs:
  n_trees:
    type: int
    low: 5
    high: 200
  reg_lambda:
    type: float
    low: 0.0001
    high: 10.0
    log: true
  min_samples_leaf:
    type: int
    low: 5
    high: 50
  min_samples_split:
    type: int
    low: 10
    high: 100
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample:
    type: float
    low: 0.5
    high: 1.0
  eta:
    type: float
    low: 0.005
    high: 0.1
    log: true

tunable_params:
  bandwidth:
    type: categorical
    categories: [scott, silverman]
  kernel:
    type: categorical
    categories: [gaussian, epanechnikov]

fixed_params:
  score_correction: bic
  score_cv_folds: 3
