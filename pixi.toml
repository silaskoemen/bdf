[workspace]
name = "bdf"
version = "0.1.0"
description = "Bayesian Distributional Forest"
authors = ["Silas Koemen <research@silaskoemen.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks]
# SOTA: Setup should build the extension immediately so 'import bdf' works instantly
setup = "pip install --no-deps -e . && pre-commit install && pixi run build-rust"
clean = "rm -rf build/ dist/ *.egg-info"
bench-bdf = "PYTHONPATH=src python -m benchmarks.run"
reg-suite = "PYTHONPATH=src python -m benchmarks.run_regression_suite"
clas-suite = "PYTHONPATH=src python -m benchmarks.run_classification_suite"
reg = "PYTHONPATH=src python -m benchmarks.calc_plot_regression_metrics"
clas = "PYTHONPATH=src python -m benchmarks.calc_plot_classification_metrics"
perf = "PYTHONPATH=src python -m benchmarks.performance"
prior-clas = "PYTHONPATH=src python -m benchmarks.effect_prior_clas"
label-noise-clas = "PYTHONPATH=src python -m benchmarks.label_noise_clas"
sample-size = "PYTHONPATH=src python -m benchmarks.effect_sample_size"
noise-features = "PYTHONPATH=src python -m benchmarks.effect_noise_features"
synth = "PYTHONPATH=src python -m benchmarks.synthetic_dgp_benchmark"
complexity = "PYTHONPATH=src python -m benchmarks.complexity_analysis"
effect-params = "PYTHONPATH=src python -m benchmarks.effect_bdf_params both"
effect-params-reg = "PYTHONPATH=src python -m benchmarks.effect_bdf_params regression"
effect-params-clas = "PYTHONPATH=src python -m benchmarks.effect_bdf_params classification"
scoring-study = "PYTHONPATH=src python -m benchmarks.scoring_method_study"
scoring-study-reg = "PYTHONPATH=src python -m benchmarks.scoring_method_study regression"
scoring-study-clas = "PYTHONPATH=src python -m benchmarks.scoring_method_study classification"
scoring-study-quick = "PYTHONPATH=src python -m benchmarks.scoring_method_study --quick"

[feature.bench-models.tasks]
bench-models = "PYTHONPATH=src python -m benchmarks.run"
reg-suite-models = "PYTHONPATH=src python -m benchmarks.run_regression_suite"
clas-suite-models = "PYTHONPATH=src python -m benchmarks.run_classification_suite"
load-data = "PYTHONPATH=src python -m benchmarks.load_save_datasets"

# ==========================================
# 1. CORE DEPENDENCIES
# ==========================================
[feature.prod.dependencies]
python = ">=3.11,<=3.13"  # hydra argparse issue with 3.14
numpy = "*"
pandas = ">=2.0"
scikit-learn = ">=1.4.4"
scipy = ">=1.10"
pydantic = ">=2.0"
tqdm = "*"
graphviz = "*"
python-graphviz = "*"

# ==========================================
# 2. FEATURES
# ==========================================

[feature.test.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
hypothesis = ">=6.0"

[feature.test.tasks]
test = "pytest -v"

[feature.lint.dependencies]
pre-commit = "*"
ruff = "*"
black = "*"
isort = "*"
pyright = "*"
ty = ">=0.0.11,<0.0.12"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
lint-rust = "cargo clippy --manifest-path compiled/rust/Cargo.toml --all-targets --all-features -- -D warnings"

[feature.bench-tools.dependencies]
matplotlib = "*"
seaborn = "*"
loguru = "*"
omegaconf = "*"
hydra-core = "<1.4.0"
optuna = "*"
tqdm = "*"
rich = "*"
scoringrules = "*"
polars = ">=1.36.1,<2"
ucimlrepo = ">=0.0.7,<0.0.8"

[feature.bench-models.dependencies]
python = "3.11.*"  # pymc-bart needs 3.11+
numpy = "<2.0.0"
lightgbm = "*"
xgboost = "*"
ngboost = ">=0.3.6,<0.4"
catboost = ">=1.2.8,<2"
quantile-forest = ">=1.4.1,<2"
# drf impossible to install: ERROR: Could not find a version that satisfies the requirement rpy2 (from drf) (from versions: none)
# ERROR: No matching distribution found for rpy2

[feature.bench-models.pypi-dependencies]
treeffuser = ">=0.1.3, <0.2"
pymc = "==5.19.1"
pymc-bart = ">=0.9.2, <0.10"
torch = ">=2.10.0, <3"

# --- DOCS FEATURE (Sphinx) ---
[feature.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"  # Or pydata-sphinx-theme (used by pandas/numpy)
sphinx-autodoc-typehints = "*"
numpydoc = "*"  # Essential for scientific docstrings

[feature.docs.tasks]
docs-start = "sphinx-quickstart docs"
docs-build = "sphinx-build -b html docs/source docs/build/html"
docs-clean = "rm -rf docs/build"

[feature.dev-tools.dependencies]
jupyter = "*"
ipykernel = "*"
pip = "*"
maturin = "*"

[feature.dev-tools.tasks]
build-rust = "maturin develop --release --manifest-path compiled/rust/Cargo.toml"

# ==========================================
# 3. ENVIRONMENTS
# ==========================================

[environments]
# DEFAULT: Core + Test + Lint + DevTools.
# Light enough to be fast, complete enough to build/test.
default = { features = ["prod", "test", "lint", "dev-tools", "bench-tools"], solve-group = "prod" }

# PROD: Minimal runtime check
prod = { features = ["prod"], solve-group = "prod" }

# TEST: CI/CD (includes prod dependencies for running tests)
test = { features = ["prod", "test", "dev-tools"], solve-group = "prod" }

# LINT: Isolated fast check, pyright requires base features
lint = { features = ["lint"] }

# BENCHMARK: Heavy plotting/model deps isolated
benchmark = { features = ["bench-tools", "bench-models", "dev-tools"], solve-group = "bench" }

# DOCS: Isolated documentation build
docs = { features = ["docs"], solve-group = "prod" }
