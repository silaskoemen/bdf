[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "bdf"
version = "0.1.0"
description = "Bayesian Distributional Forest"
authors = [
    {name = "Silas Koemen", email = "research@silaskoemen.com"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scikit-learn>=1.4.4",
    "scipy>=1.10",
    "pydantic>=2.0",
    "tqdm",
    "graphviz",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "compiled/**/*.py", "benchmarks/**/*.py", "tests/**/*.py"]
exclude = ["examples", ".git", "__pycache__", "*.pyc", "venv*"]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E402"]
