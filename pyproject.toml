[build-system]
build-backend = "maturin"
requires = ["maturin>=1.4,<2.0"]

[project]
name = "bayesian-distributional-forest"
version = "0.1.0rc3"
description = "Bayesian Distributional Forest: probabilistic random forests with full predictive distributions"
authors = [
    {name = "Anonymous"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scikit-learn>=1.4.4",
    "scipy>=1.10",
    "pydantic>=2.0",
    "tqdm",
    "graphviz",
]

[tool.maturin]
manifest-path = "compiled/rust/Cargo.toml"
python-source = "src"
module-name = "bdf._bdf_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "compiled/**/*.py", "benchmarks/**/*.py", "tests/**/*.py"]
exclude = ["examples", ".git", "__pycache__", "*.pyc", "venv*"]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E402"]
